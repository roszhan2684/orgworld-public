name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.4.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0, cache: pnpm }
      - name: Private research dossier is never committed
        run: test ! -e EVOORG_RESEARCH.md && test ! -e docs/research/source
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm vitest run --project unit
        env: { CI: 'true' }
      - run: pnpm build
      - run: git diff --exit-code dist/ || (echo "dist/ is stale — run pnpm build and commit" && exit 1)
